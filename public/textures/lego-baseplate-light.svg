<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="studLightGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f1f4" />
      <stop offset="100%" stop-color="#dcdee3" />
    </radialGradient>
  </defs>
  <!-- Stud cast shadow -->
  <circle cx="16" cy="17.2" r="7.4" fill="#000000" opacity="0.08" />
  <!-- Stud cylinder top -->
  <circle cx="16" cy="16" r="6.8" fill="url(#studLightGrad)" stroke="#cecfd5" stroke-width="0.75" />
  <!-- Top specular highlight edge -->
  <circle cx="16" cy="15.5" r="5.6" fill="none" stroke="#ffffff" stroke-width="0.9" />
  <!-- Inner stud ring with subtle red accent -->
  <circle cx="16" cy="15.8" r="2.6" fill="none" stroke="rgba(255, 0, 0, 0.22)" stroke-width="0.55" />
</svg>
